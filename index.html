<script>
function mostrar(event, id) {
  document.querySelectorAll('.pagina').forEach(p => p.classList.remove('ativa'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('ativo'));

  document.getElementById(id).classList.add('ativa');
  event.currentTarget.classList.add('ativo');
}

function pesquisarMods() {
  const texto = document.getElementById("pesquisa").value.toLowerCase();
  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    const nome = card.querySelector("h3").innerText.toLowerCase();

    card.style.display =
      texto === "" || nome.includes(texto) ? "block" : "none";
  });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
const firebaseConfig = {
  apiKey: "AIzaSyCEa3uN9x4hUMt02DkHIsnyPSmWO9caIzE",
  authDomain: "portal-nebuloso.firebaseapp.com",
  projectId: "portal-nebuloso",
  storageBucket: "portal-nebuloso.firebasestorage.app",
  messagingSenderId: "755593713969",
  appId: "1:755593713969:web:0c3a45cb65061d1457f810",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
getRedirectResult(auth)
  .then((result) => {
    if (result) {
      console.log("Login realizado com sucesso!");
    }
  })
  .catch((error) => {
    console.log("Erro redirect:", error);
  });
    
/* LOGIN */
window.loginGoogle = async function () {
  try {
    await signInWithRedirect(auth, provider);
  } catch (e) {
    console.log("Erro login:", e);
  }
};

/* LOGOUT */
window.logout = async function () {
  try {
    await signOut(auth);

    const search = document.getElementById("pesquisa");
    if (search) search.value = "";

  } catch (e) {
    console.log("Erro logout:", e);
  }
};

/* ESTADO LOGIN */
onAuthStateChanged(auth, (user) => {

  const loading = document.getElementById("loading");
  const login = document.getElementById("loginScreen");
  const site = document.getElementById("site");
  const logoutBtn = document.getElementById("logoutBtn");

  const userInfo = document.getElementById("userInfo");
  const userName = document.getElementById("userName");
  const userPhoto = document.getElementById("userPhoto");

  // loading seguro
  if (loading) {
    loading.style.opacity = "0";
    setTimeout(() => {
      loading.style.display = "none";
    }, 300);
  }

  if (user) {

    // Mostrar nome e foto
    if (userInfo) userInfo.style.display = "flex";

    if (userName) {
      userName.textContent = user.displayName || "Usuário";
    }

    if (userPhoto) {
      userPhoto.src = user.photoURL || "";
    }

    login?.classList.add("hidden");
    login?.classList.remove("visible");

    site?.classList.add("visible");
    site?.classList.remove("hidden");

    if (logoutBtn) logoutBtn.style.display = "block";

  } else {

    site?.classList.add("hidden");
    site?.classList.remove("visible");

    login?.classList.add("visible");
    login?.classList.remove("hidden");

    if (logoutBtn) logoutBtn.style.display = "none";

    if (userInfo) {
      userInfo.style.display = "none";
    }
  }
});
</script>
<script>

    const loader =
    document.getElementById("loader");

    if(loader){
    loader.style.opacity="0";

    setTimeout(()=>{
        loader.remove();
    },600);
}

});
</script>
