<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffff">   
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Portal Nebuloso ⚡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-box">
    <div class="loader-logo">⚡</div>
    <h2>Portal Nebuloso</h2>
    <div class="loader-text">Carregando universo...</div>
    <div class="loader-bar">
      <div class="loader-fill"></div>
    </div>
  </div>
</div>

<!-- USER INFO -->
<div id="userInfo" style="
position:fixed;
top:10px;
left:10px;
display:none;
align-items:center;
gap:10px;
background:rgba(0,0,0,0.6);
padding:8px 12px;
border-radius:12px;
color:#00ffff;
font-weight:bold;
z-index:10000;
backdrop-filter:blur(5px);
cursor:pointer;
">

<img id="userPhoto" src="" alt="Foto" style="
width:40px;
height:40px;
border-radius:50%;
border:2px solid #00ffff;
object-fit:cover;
">

<!-- MENU -->
<div id="profileMenu" style="
display:none;
position:absolute;
top:60px;
left:0;
background:rgba(0,0,0,0.9);
border:1px solid #00ffff;
border-radius:12px;
padding:10px;
width:150px;
z-index:99999;
">
  <button onclick="logout()" style="width:100%;padding:8px;border:none;border-radius:8px;background:#ff3b3b;color:white;cursor:pointer;">
    🚪 Sair
  </button>

  <button id="installBtn" style="width:100%;padding:8px;margin-top:8px;border:none;border-radius:8px;background:#00ffff;color:black;cursor:pointer;font-weight:bold;">
    ⬇ Instalar App
  </button>
</div>

</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <img src="Banner.png" class="login-banner">

    <h1>PORTAL NEBULOSO</h1>

    <p class="login-desc">
      Entre no universo Nebuloso e faça parte da comunidade.
    </p>

    <div class="status-online">
      <span class="dot"></span>
      Servidor Online
    </div>

    <button onclick="window.loginGoogle()">🔵 Entrar com Google</button>
    <button onclick="window.loginAnonimo()">👤 Entrar como Visitante</button>
  </div>
</div>

<!-- SITE -->
<div class="container hidden" id="site">

  <!-- MENU -->
  <div class="tabs">
    <button onclick="mostrar(event,'inicio')">🏠 Início</button>
    <button onclick="mostrar(event,'mods')">🛒 Mods</button>
    <button onclick="mostrar(event,'dupladodia')">🏆 Hall da Fama</button>
    <button onclick="mostrar(event,'galeria')">📸 Galeria</button>
    <button onclick="mostrar(event,'discord')">🎮 Discord</button>
    <button onclick="mostrar(event,'feedback')">💬 Feedback</button>
    <button onclick="mostrar(event,'emBreve')">🚧 Tutorial</button>
    <button onclick="mostrar(event,'chat')">💬 Chat</button>
  </div>

  <!-- INICIO -->
  <section id="inicio" class="pagina ativa">
    <div class="hero">
      <img src="Banner.png" style="width:100%;border-radius:20px;">
      <p id="saudacao">✨ Bem-vindo ao Portal Nebuloso</p>
      <h1>🌌 Portal Nebuloso</h1>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chat" class="pagina">
    <div class="hero">
      <h1>💬 Chat Nebuloso</h1>
    </div>

    <div class="hall-card">
      <div id="mensagens" class="chat-box"></div>

      <div class="chat-input">
        <input id="mensagemInput" placeholder="Digite uma mensagem...">
        <button onclick="enviarMensagem()">📨</button>
        <button onclick="apagarTodasMsg()">🧹</button>
      </div>
    </div>
  </section>

  <!-- MODS -->
  <section id="mods" class="pagina">
    <div class="hero">
      <h1>🛒 Mods Disponíveis</h1>
      <p id="contadorMods"></p>
    </div>

    <input id="pesquisa" placeholder="🔍 Pesquisar mods..." onkeyup="pesquisarMods()">

    <div class="grid">
      <div class="card">
        <img src="amongus.jpg">
        <h3>Among Us Mod</h3>
        <a href="#">Baixar</a>
      </div>

      <div class="card">
        <img src="starlight.png">
        <h3>Starlight Pack</h3>
        <a href="#">Baixar</a>
      </div>
    </div>
  </section>

  <!-- OUTRAS PÁGINAS SIMPLES -->
  <section id="dupladodia" class="pagina"></section>
  <section id="galeria" class="pagina"></section>
  <section id="discord" class="pagina"></section>
  <section id="feedback" class="pagina"></section>
  <section id="emBreve" class="pagina"></section>

</div>

<!-- SCRIPTS -->
<script>
function mostrar(event,id){
  document.querySelectorAll('.pagina').forEach(p=>{
    p.classList.remove('ativa');
  });

  document.getElementById(id).classList.add('ativa');

  document.querySelectorAll('.tabs button')
  .forEach(b=>b.classList.remove('ativo'));

  event.currentTarget.classList.add('ativo');
}

function pesquisarMods(){
  const t = document.getElementById("pesquisa").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    const nome = c.querySelector("h3").innerText.toLowerCase();
    c.style.display = nome.includes(t) ? "block" : "none";
  });
}
</script>

</body>
</html>
